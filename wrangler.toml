name = "gemini-relay"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "RELAY_HUB"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]

[observability]
enabled = true

[vars]
# Supertone TTS 설정
SUPERTONE_VOICE_ID = "4zKPN3fAc5pqNUgrQKfJt6"
SUPERTONE_MODEL    = "sona_speech_1"

# 아래 시크릿은 wrangler CLI로 별도 등록:
#   wrangler secret put SUPERTONE_API_KEY
