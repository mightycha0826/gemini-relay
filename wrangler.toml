name = "gemini-relay"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 자체 배포한 추론 게이트웨이 주소 (nginx → Node 게이트웨이 → Python 추론 서비스)
# server/index.js 가 실제로 응답하는 도메인/포트를 적을 것 (예: "https://infer.example.com")
INFER_API_URL = "https://REPLACE_ME.example.com"

# 아래 시크릿은 wrangler CLI로 별도 등록:
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put INFER_API_TOKEN
